<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Registro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FBF1DE"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body>
<main class="centro">
  <img class="logo" src="icon-192.png" alt=""><h1>Crear cuenta</h1><p class="sub" style="text-align:center">Alumno</p>
  <div class="card"><form id="f"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" placeholder="Tu nombre completo" required ><label for="gsel">Grupo</label><select id="gsel" required><option value="" disabled selected>Cargando grupos…</option></select><input type="hidden" id="area" name="area"><input type="hidden" id="semestre" name="semestre"><input type="hidden" id="grupo" name="grupo"><label for="curp">CURP</label><input id="curp" name="curp" placeholder="Tu CURP (18 caracteres)" required minlength="18" maxlength="18" pattern="[A-Za-z0-9]{18}" autocapitalize="characters" style="text-transform:uppercase"><label for="correo">Correo electrónico</label><input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required ><label for="tutorCurp">CURP de tu tutor (opcional)</label><input id="tutorCurp" name="tutorCurp" placeholder="CURP de tu padre, madre o tutor" minlength="18" maxlength="18" pattern="[A-Za-z0-9]{18}" autocapitalize="characters" style="text-transform:uppercase">
<label for="password">Contraseña</label><input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
    <button class="btn" type="submit">CREAR CUENTA</button><p class="msg" id="msg"></p></form></div>
  <p class="sub" style="text-align:center"><a href="entrada.html">← Ya tengo cuenta</a></p>
</main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i);
let G=[];
(async()=>{try{G=await (await fetch("/api/grupos")).json();localStorage.setItem("sd_grupos",JSON.stringify(G));}catch(e){G=JSON.parse(localStorage.getItem("sd_grupos")||"[]");}
  G.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  $("gsel").innerHTML=(G.length?'<option value="" disabled selected>Selecciona tu grupo</option>':'<option value="" disabled selected>Aún no hay grupos: pregunta al administrador</option>')+G.map((g,i)=>`<option value="${i}">${g.nombre}</option>`).join("");})();
$("gsel").addEventListener("change",()=>{const g=G[+$("gsel").value];$("area").value=g.area;$("semestre").value=g.semestre;$("grupo").value=g.grupo;});
$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("msg").textContent="Guardando…";
  const d=Object.fromEntries(new FormData(e.target)); d.curp=d.curp.toUpperCase(); d.tutorCurp=(d.tutorCurp||"").toUpperCase();
  try{ await SD.register("alumno",d); await SD.login("alumno",d.curp,d.password); location.href="menu_alumnos.html"; }
  catch(err){ $("msg").textContent=err.message; }
});
</script></body></html>
