<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHARK DARK.Registro_de_alumno</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: white;

            background:
                radial-gradient(circle at 15% 20%, rgba(250,46,73,0.25), transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(166,3,24,0.3), transparent 30%),
                linear-gradient(135deg, #201113, #3a191d 48%, #231315);
        }

        /* Tarjeta principal */
        .contenedor {
            width: min(1050px, 100%);
            min-height: 650px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            overflow: hidden;

            background: rgba(21,11,12,0.88);
            border: 1px solid rgba(249,244,235,0.1);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
        }

        /* Lado visual */
        .visual {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px;

            background:
                radial-gradient(circle at 20% 25%, rgba(229,6,36,0.75) 0 10%, transparent 25%),
                radial-gradient(circle at 78% 70%, rgba(166,3,24,0.55) 0 8%, transparent 28%),
                linear-gradient(145deg, #261417, #311519 55%, #1b0f10);
        }

        /* Estrellas */
        .visual::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .75;
            background-image:
                radial-gradient(circle, rgb(235,228,228) 1px, transparent 1.5px),
                radial-gradient(circle, rgba(223,223,224,0.966) 1px, transparent 1.5px);
            background-size: 65px 65px, 105px 105px;
            background-position: 10px 15px, 35px 45px;
        }

        /* Planeta decorativo */
        .planeta {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            top: -105px;
            left: -95px;
            background:
                radial-gradient(circle at 35% 30%, #efe0c8, #e50624 45%, #471e24 72%, #261417);
            box-shadow: 0 0 60px rgba(250,46,73,0.35);
            opacity: .9;
        }

        .visual > *:not(.planeta) {
            position: relative;
            z-index: 2;
        }

        .marca {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .marca span {
            color: #fa2e49;
        }

        .mensaje {
            margin-top: auto;
            margin-bottom: 25px;
        }

        .mensaje h2 {
            font-size: clamp(32px, 4vw, 52px);
            line-height: 1.05;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .mensaje h2 span {
            color: #fa2e49;
        }

        .mensaje p {
            max-width: 380px;
            color: #eddfc9;
            line-height: 1.6;
            font-size: 15px;
        }

        /* Formulario */
        .formulario {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px;
        }

        .form-contenido {
            width: 100%;
            max-width: 430px;
        }

        .encabezado {
            margin-bottom: 32px;
        }

        .encabezado h1 {
            font-size: 42px;
            margin-bottom: 9px;
            letter-spacing: -1px;
        }

        .encabezado p {
            color: #c8b699;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-size: 13px;
            font-weight: bold;
            color: #eddfc9;
        }

        input,
        select {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid rgba(249,244,235,0.12);
            border-radius: 10px;
            outline: none;

            color: white;
            background: #321619;
            font-size: 14px;
            font-family: inherit;
            transition: .25s;
        }

        input::placeholder {
            color: #c5b293;
        }

        select {
            cursor: pointer;
            color-scheme: dark;
        }

        input:focus,
        select:focus {
            border-color: #fa2e49;
            box-shadow: 0 0 0 3px rgba(250,46,73,0.1);
        }

        select option {
            color: white;
            background: #321619;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;

            border: none;
            border-radius: 11px;

            color: white;
            background: linear-gradient(90deg, #a60318, #e50624);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 8px 25px rgba(166,3,24,0.3);
            transition: transform .2s, box-shadow .2s;
        }

       
        button:focus {
    background: linear-gradient(90deg, #a60318, #fa2e49);
    box-shadow: 0 0 0 3px rgba(250,46,73,0.25),
                0 8px 25px rgba(250,46,73,0.3);
    outline: none;
}

        .separador {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 18px;
            color: #746b83;
            font-size: 11px;
        }

        .separador::before,
        .separador::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(249,244,235,0.12);
        }

        .redes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .red {
            padding: 12px;
            border: 1px solid rgba(249,244,235,0.08);
            border-radius: 9px;
            background: #321619;
            color: #eddfc9;
            text-align: center;
            font-size: 13px;
        }

        .pie {
            margin-top: 22px;
            text-align: center;
            color: #777083;
            font-size: 11px;
            line-height: 1.5;
        }

        .pie span {
            color: #a60318;
        }

        /* Adaptación para celular */
        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            .contenedor {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .visual {
                min-height: 260px;
                padding: 30px;
            }

            .planeta {
                width: 250px;
                height: 250px;
                top: -90px;
                left: -80px;
            }

            .mensaje h2 {
                font-size: 34px;
            }

            .formulario {
                padding: 35px 25px 40px;
            }

            .encabezado h1 {
                font-size: 34px;
            }
        }
    .marca span{color:#f0dfc4 !important}
</style>
</head>

<body>

    <main class="contenedor">

        <!-- Parte visual inspirada en la imagen -->
        <section class="visual">
            <div class="planeta"></div>

            <div class="marca">
                🦈<span>SHARK</span> DARK
            </div>

            <div class="mensaje">
                <h2>
                    REGISTRATE<br>
                    <span>y comienza.</span>
                </h2>

                <p>
                    ¡ACCEDE A TU CUENTA YA!
                </p>
            </div>
        </section>

        <!-- Formulario original -->
        <section class="formulario">
            <div class="form-contenido">

                <div class="encabezado">
                    <h1>REGISTRATE</h1>
                    <p>Ingresa tus datos para continuar</p>
                </div>

                <form id="form">

                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre completo"
                        autocomplete="name"
                        required
                    >

                    <label for="area">Área - especialidad</label>
                    <select id="area" name="area" required>
                        <option value="" disabled selected>Selecciona tu área o especialidad</option>
                        <option value="Programación">Programación</option>
                        <option value="Ofimática">Ofimática</option>
                        <option value="Enfermería">Enfermería</option>
                        <option value="Electricidad">Electricidad</option>
                        <option value="Laboratorios Químicos">Lab. Químicos</option>
                        <option value="Administración">Administración</option>
                    </select>

                    <label for="semestre">Semestre</label>
                    <select id="semestre" name="semestre" required>
                        <option value="" disabled selected>Selecciona tu semestre</option>
                        <option value="1-2 semestre">1-2 semestre</option>
                        <option value="3-4 semestre">3-4 semestre</option>
                        <option value="5-6 semestre">5-6 semestre</option>
                    </select>

                    <label for="grupo">Grupo</label>
                    <select id="grupo" name="grupo" required>
                        <option value="" disabled selected>Selecciona tu grupo</option>
                        <option value="A">Grupo A</option>
                        <option value="B">Grupo B</option>
                    </select>

                    <label for="curp">CURP</label>
                    <input
                        type="text"
                        id="curp"
                        name="curp"
                        placeholder="Escribe tu CURP (18 caracteres)"
                        minlength="18"
                        maxlength="18"
                        pattern="[A-Za-z0-9]{18}"
                        title="La CURP debe contener 18 caracteres alfanuméricos"
                        autocapitalize="characters"
                        required
                    >

                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required
                    >

                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crea una contraseña (mínimo 6)" minlength="6"
                        autocomplete="new-password"
                        required
                    >

             <button type="submit">REGISTRARSE</button>
<p id="msg" style="margin-top:14px;text-align:center;color:#ffb454;font-size:13px;min-height:18px"></p>

                </form>

            </div>
        </section>

    </main>

<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i), msg=$("msg");
$("curp").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
$("form").addEventListener("submit",async e=>{
  e.preventDefault(); msg.textContent="Guardando…";
  const d=Object.fromEntries(new FormData(e.target)); d.curp=d.curp.toUpperCase();
  try{ await SD.register("alumno",d); await SD.login("alumno",d.curp,d.password); location.href="menu_alumnos.html"; }
  catch(err){ msg.textContent=err.message; }
});
</script>
</body>
</html>
