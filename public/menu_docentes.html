<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Docente</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A0A0E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body><main>
<div class="hero"><h1>Hola, <span id="nombre"></span> 👋</h1>
<p class="sub">Escanea el QR de un alumno para registrar su asistencia.</p></div>
<a class="btn" href="escanear.html" style="font-size:18px;padding:22px;margin-bottom:14px">📷 ESCANEAR QR</a>
<div class="card"><h2>MIS CLASES</h2><ul id="misclases"></ul></div>
<div class="card"><h2>REGISTRADAS HOY</h2><div class="num" id="total">0</div></div>
<div class="card"><h2>ÚLTIMOS REGISTROS</h2><ul id="lista"></ul></div>
<a class="btn" href="calificaciones.html" style="margin-bottom:14px">📊 Calificaciones</a>
<a class="btn" id="lp" href="permisos.html" style="margin-bottom:14px">📝 Permisos</a>
<div class="card"><h2>PRÓXIMAMENTE</h2><div class="pronto"><span>📚 Materias</span><span>⏰ Horario</span></div></div>
</main>
<script src="app.js"></script>
<script src="shell.js"></script>
<script>
const $=i=>document.getElementById(i), esc=SD.esc, s=SD.require("docente");
const hoy=new Date().toLocaleDateString("sv-SE"), mes=hoy.slice(0,7);
const orden=(a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora);
const fila=(a,txt)=>`<li><span>${esc(a.fecha)} · ${esc(a.hora)}</span><span>${a.pendiente?'<span class="tag">pendiente</span>':txt}</span></li>`;
$("nombre").textContent=(s.nombre||"").split(" ")[0];
async function pintar(){
  const d=await SD.datos(), nom={}; d.alumnos.forEach(a=>nom[a.curp]=a.nombre);
  const m=d.asistencias.filter(a=>a.docente===s.id&&a.estado!=="falta").sort(orden);
  $("total").textContent=m.filter(a=>a.fecha===hoy).length;
  $("lista").innerHTML=m.slice(0,6).map(a=>`<li><span>${esc(nom[a.curp]||a.curp)} <small style="color:#a58581">${esc(a.materia||"")}</small></span><span>${a.pendiente?'<span class="tag">pendiente</span>':esc(a.hora)}</span></li>`).join("")||'<li class="vacio">Aún no registras asistencias</li>';
}
async function clasesDoc(){let c;try{c=await SD.api("/api/clases");localStorage.setItem("sd_clases",JSON.stringify(c));}catch(e){c=JSON.parse(localStorage.getItem("sd_clases")||"[]");}
  $("misclases").innerHTML=c.map(x=>`<li><a href="escanear.html" onclick="localStorage.setItem('sd_clase_id','${esc(x.id)}')" style="color:#7a1f26;text-decoration:none">${esc(x.materia)}</a><span>${esc(x.semestre+" "+x.area+" "+x.grupo)}</span></li>`).join("")||'<li class="vacio">Aún no tienes clases asignadas. Pídelas al administrador.</li>';}
clasesDoc(); pintar(); document.addEventListener("sd-sync",pintar);
</script></body></html>
