<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Permisos</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FBF1DE"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body><main>
<h1>Permisos</h1>
<p class="sub" id="sub"></p>
<div class="banner" id="banner"></div>
<div class="card" id="nuevo" style="display:none"><h2 style="font-size:16px;margin-bottom:8px">Pedir permiso para mi alumno</h2>
  <label class="sub" style="margin:0">Alumno</label><select id="al"></select>
  <label class="sub" style="margin:8px 0 0;display:block">Desde</label><input type="date" id="d1" style="text-transform:none">
  <label class="sub" style="margin:8px 0 0;display:block">Hasta</label><input type="date" id="d2" style="text-transform:none">
  <input id="mo" placeholder="Motivo (ej. cita médica)" maxlength="200" style="margin-top:8px;text-transform:none">
  <button class="btn" id="enviar">ENVIAR SOLICITUD</button></div>
<div id="lista"></div>
<a class="back" id="volver" href="#">← Volver al menú</a>
</main>
<script src="app.js"></script>
<script src="shell.js"></script>
<script>
const $=i=>document.getElementById(i), esc=SD.esc, s=SD.require(["tutor","docente"]), doc=s.rol==="docente";
$("volver").href=doc?"menu_docentes.html":"menu_tutor.html";
$("sub").textContent=doc?"Solicitudes de los tutores de tus grupos. Si apruebas, ese día no cuenta como falta.":"Pide un permiso y un docente de su grupo lo aprobará.";
function aviso(cls,t,x){const b=$("banner");b.className="banner "+cls;b.style.display="block";b.innerHTML="<b>"+esc(t)+"</b>"+esc(x||"");}
const hoy=new Date().toLocaleDateString("sv-SE"), fmt=f=>f.slice(8)+"/"+f.slice(5,7);
const COL={pendiente:"#b9770e",aprobado:"#3f7d4f",rechazado:"#b3412e"};
async function cargar(){
  let l=[]; try{l=await SD.api("/api/permisos");}catch(e){$("lista").innerHTML='<div class="card"><p class="sub" style="margin:0">Necesitas internet para ver los permisos.</p></div>';return;}
  $("lista").innerHTML=l.map(p=>`<div class="card"><b>${esc(p.alumno)}</b> <span class="tag" style="color:${COL[p.estado]};border-color:${COL[p.estado]}">${esc(p.estado)}</span>
    <p class="sub" style="margin:4px 0 6px">Del ${fmt(p.desde)} al ${fmt(p.hasta)} · ${esc(p.motivo)}</p>
    ${doc&&p.estado==="pendiente"?`<button class="mini" data-i="${esc(p.id)}" data-a="aprobar" style="margin-left:0">Aprobar</button><button class="mini" data-i="${esc(p.id)}" data-a="rechazar" style="color:#b3412e">Rechazar</button>`:""}</div>`).join("")||'<div class="card"><p class="sub" style="margin:0">No hay permisos.</p></div>';
}
$("lista").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-i]");if(!b)return;
  try{await SD.api("/api/permisos/"+b.dataset.i+"/resolver",{method:"POST",body:{accion:b.dataset.a}});aviso("ok",b.dataset.a==="aprobar"?"✔ Permiso aprobado":"Permiso rechazado","Se avisó al tutor.");cargar();}
  catch(e){aviso("err","No se pudo",e.status?e.message:"Necesitas internet");}});
if(!doc){ $("nuevo").style.display="block"; SD.vinculos().then(l=>{const ok=l.filter(x=>x.estado==="vinculado");$("al").innerHTML=ok.map(x=>`<option value="${esc(x.curp)}">${esc(x.nombre)}</option>`).join("")||"<option value=''>Primero vincula a un alumno</option>";const a=localStorage.getItem("sd_alumno");if(a)$("al").value=a;}); $("d1").value=$("d2").value=hoy;
  $("enviar").onclick=async()=>{try{await SD.api("/api/permisos",{method:"POST",body:{curp:$("al").value,desde:$("d1").value,hasta:$("d2").value,motivo:$("mo").value}});$("mo").value="";aviso("ok","✔ Solicitud enviada","El docente de su grupo la revisará.");cargar();}
    catch(e){aviso("err","No se pudo enviar",e.status?e.message:"Necesitas internet");}};}
cargar();
</script></body></html>
