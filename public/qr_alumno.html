<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Código QR</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FBF1DE"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body><main>
<h1>Mi código QR</h1>
<p class="sub">Contiene únicamente tu CURP. Muéstralo al docente para registrar tu asistencia. Funciona sin internet.</p>
<div class="card" style="text-align:center">
  <div id="qr" style="width:260px;max-width:100%;margin:auto;border-radius:10px;overflow:hidden;background:#f9f4eb"></div>
  <p id="curp" style="margin-top:14px;font-size:18px;letter-spacing:2px;font-weight:bold"></p>
  <button class="btn" id="bajar">DESCARGAR QR (PNG)</button>
</div>
<div class="card"><dl id="datos"></dl></div>
<a class="back" href="menu_alumnos.html">← Volver al menú</a>
</main>
<script src="app.js"></script>
<script src="shell.js"></script>
<script>
const s=SD.require("alumno"), curp=s.curp||s.id;
document.getElementById("qr").innerHTML=SD.qr(curp);
document.getElementById("curp").textContent=curp;
document.getElementById("datos").innerHTML=[["Nombre",s.nombre],["Área",s.area],["Semestre",s.semestre],["Grupo",s.grupo]]
  .map(([k,v])=>`<dt>${k}</dt><dd>${SD.esc(v||"—")}</dd>`).join("");
document.getElementById("bajar").onclick=()=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=600;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(img,0,0,600,600);
    const a=document.createElement("a");a.download="QR-"+curp+".png";a.href=c.toDataURL("image/png");a.click();};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(SD.qr(curp));
};
</script></body></html>
