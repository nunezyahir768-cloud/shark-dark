<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Entrar</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A0A0E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body>
<!-- SPLASH -->
<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#6e161c 0%,#3d0a0e 55%,#210407 100%);color:#f7e3df;overflow:hidden;transition:opacity .9s}
#splash.fuera{opacity:0;pointer-events:none}
#splash .rej{position:absolute;inset:0;background-image:linear-gradient(rgba(255,215,210,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,210,.06) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(circle at 50% 42%,#000,transparent 68%);mask-image:radial-gradient(circle at 50% 42%,#000,transparent 68%);animation:rj 4s ease-out both}
@keyframes rj{from{opacity:0}to{opacity:1}}
#splash svg{width:min(76vw,300px);height:auto;overflow:visible}
#splash .anillo{fill:none;stroke:#f7d9d4;stroke-width:1.4;stroke-dasharray:880;stroke-dashoffset:880;animation:dib 1.6s .2s cubic-bezier(.6,0,.2,1) forwards}
#splash .ticks{fill:none;stroke:rgba(247,217,212,.55);stroke-width:5;stroke-dasharray:1.5 11;transform-origin:150px 150px;opacity:0;animation:ap .6s .9s forwards,gira 14s linear infinite}
#splash .arco{fill:none;stroke:#d9a27a;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:130 560;transform-origin:150px 150px;opacity:0;animation:ap .6s 1.1s forwards,gira2 5s linear infinite}
#splash .disco{fill:#1a0507;stroke:rgba(247,217,212,.35);stroke-width:1;opacity:0;animation:ap .8s .7s forwards}
#splash .logo{opacity:0;filter:blur(8px);animation:logo 1.2s 1.6s ease-out forwards}
#splash .barrido{fill:url(#gb);opacity:0;animation:barr 1.3s 1.7s ease-in-out forwards}
@keyframes dib{to{stroke-dashoffset:0}}@keyframes ap{to{opacity:1}}@keyframes gira{to{transform:rotate(360deg)}}@keyframes gira2{to{transform:rotate(-360deg)}}
@keyframes logo{to{opacity:1;filter:blur(0)}}
@keyframes barr{0%{opacity:0;transform:translateY(-70px)}20%{opacity:.9}100%{opacity:0;transform:translateY(80px)}}
#splash .t1{margin-top:26px;font:600 26px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:2px;opacity:0;animation:tx 1.4s 2.3s cubic-bezier(.2,.8,.2,1) forwards}
#splash .t2{margin-top:10px;font:11px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:5px;color:#e6b9b4;opacity:0;animation:tx 1s 2.7s forwards}
@keyframes tx{from{opacity:0;letter-spacing:16px}to{opacity:1}}
#splash .t2{animation-name:tx2}@keyframes tx2{from{opacity:0}to{opacity:1}}
#splash .barra{width:min(60vw,230px);height:2px;margin-top:30px;background:rgba(247,217,212,.18);border-radius:2px;overflow:hidden;opacity:0;animation:ap .4s 2.8s forwards}
#splash .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a27a,#f7d9d4);animation:carga 1.7s 2.9s ease-in-out forwards}
@keyframes carga{to{width:100%}}
#splash .t3{margin-top:12px;font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:3px;color:#c98f89;opacity:0;animation:ap .4s 2.9s forwards}
#splash small{position:absolute;bottom:20px;font:11px "Segoe UI",sans-serif;letter-spacing:1px;color:rgba(247,217,212,.4)}
</style>
<div id="splash" aria-hidden="true"><div class="rej"></div>
  <svg viewBox="0 0 300 300"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d9d4" stop-opacity="0"/><stop offset=".5" stop-color="#f7d9d4" stop-opacity=".55"/><stop offset="1" stop-color="#f7d9d4" stop-opacity="0"/></linearGradient><clipPath id="cd"><circle cx="150" cy="150" r="96"/></clipPath></defs>
    <circle class="anillo" cx="150" cy="150" r="140"/><circle class="ticks" cx="150" cy="150" r="124"/>
    <circle class="arco" cx="150" cy="150" r="110"/><circle class="disco" cx="150" cy="150" r="96"/>
    <g clip-path="url(#cd)"><image class="logo" href="img/tiburon.png" x="72" y="94" width="156" height="114"/><rect class="barrido" x="54" y="150" width="192" height="60"/></g></svg>
  <div class="t1">CBTIS 170</div><div class="t2">SHARK DARK · PORTAL ESCOLAR</div>
  <div class="barra"><i></i></div><div class="t3" id="est">INICIANDO SISTEMA</div><small>Toca para saltar</small></div>
<script>
(()=>{
  const sp=document.getElementById("splash");
  if(sessionStorage.getItem("sd_splash")||matchMedia("(prefers-reduced-motion: reduce)").matches){sp.remove();return;}
  sessionStorage.setItem("sd_splash","1");
  const fin=()=>{sp.classList.add("fuera");setTimeout(()=>sp.remove(),1000);};
  sp.addEventListener("click",fin); setTimeout(fin,5300);
  const m=["INICIANDO SISTEMA","VERIFICANDO ACCESO","CARGANDO PORTAL"];let i=0;
  const iv=setInterval(()=>{const e=document.getElementById("est");if(!e){clearInterval(iv);return;}e.textContent=m[++i%m.length];},600);
})();
</script>
<!-- /SPLASH -->
<main class="centro">
  <img class="logo" src="icon-192.png" alt="">
  <h1>SHARK DARK</h1><p class="sub" style="text-align:center">CBTIS 170 · Portal escolar</p>
  <div class="card">
    <label for="rol">Entrar como</label>
    <select id="rol"><option value="alumno">Alumno</option><option value="tutor">Tutor</option><option value="docente">Docente</option></select>
    <label for="u" id="lu">CURP</label><input id="u" placeholder="Tu CURP (18 caracteres)" autocomplete="username" autocapitalize="characters" style="text-transform:uppercase">
    <label for="p">Contraseña</label><input id="p" type="password" placeholder="Tu contraseña" autocomplete="current-password">
    <button class="btn" id="entrar">ENTRAR</button><p class="msg" id="msg"></p>
  </div>
  <div class="card"><h2>¿Eres nuevo? Crea tu cuenta</h2><div class="trio">
    <a class="btn sec" style="margin:0" href="registro_alumno.html">Soy alumno</a><a class="btn sec" style="margin:0" href="registro_tutor.html">Soy tutor</a><a class="btn sec" style="margin:0" href="registro_docente.html">Soy docente</a></div></div>
  </main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i), DEST={alumno:"menu_alumnos.html",docente:"menu_docentes.html",tutor:"menu_tutor.html",admin:"admin.html#cuentas"};
const s=SD.session(); if(s&&DEST[s.rol]) location.replace(DEST[s.rol]);
async function entrar(){
  $("msg").textContent="Entrando…";
  try{const u=await SD.login($("rol").value,$("u").value,$("p").value); location.href=DEST[u.rol];}
  catch(e){$("msg").textContent=e.message;}
}
const lab=()=>{const d=$("rol").value==="docente";$("lu").textContent=d?"RFC":"CURP";$("u").placeholder=d?"Tu RFC (13 caracteres)":"Tu CURP (18 caracteres)";localStorage.setItem("sd_rol",$("rol").value);};
$("rol").value=localStorage.getItem("sd_rol")||"alumno"; $("rol").onchange=lab; lab();
$("entrar").onclick=entrar; $("p").addEventListener("keydown",e=>{if(e.key==="Enter")entrar();});
</script></body></html>
