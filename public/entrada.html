<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Entrar</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FBF1DE"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body>
<!-- SPLASH -->
<style>
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .8s;overflow:hidden}
#splash.fuera{opacity:0;pointer-events:none}
#splash canvas,#splash #flash{position:absolute;inset:0;width:100%;height:100%}
#splash #flash{background:radial-gradient(circle at 50% 45%,#f0dfc4 0%,#ff2a44 28%,rgba(211,1,29,.5) 52%,transparent 75%);opacity:0}
#splash .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:-30px}
#splash #tile{position:relative;width:150px;height:150px;display:grid;place-items:center}
#splash #tile::before{content:"";position:absolute;inset:0;border-radius:36px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(240,223,196,.25);box-shadow:inset 0 0 30px rgba(211,1,29,.18),0 18px 40px rgba(0,0,0,.6);opacity:0;transform:scale(.7);transition:all .9s cubic-bezier(.2,.8,.2,1)}
#splash #tile.on::before{opacity:1;transform:scale(1)}
#splash #beam{position:absolute;bottom:100%;width:70px;height:220px;background:linear-gradient(to top,rgba(255,190,160,.38),transparent);filter:blur(6px);opacity:0}
#splash #beam.on{animation:haz 1.6s ease-out}
@keyframes haz{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#splash #floor{position:absolute;width:280px;height:34px;top:100%;margin-top:6px;background:radial-gradient(ellipse,rgba(211,1,29,.55),transparent 70%);filter:blur(8px);opacity:0;transition:opacity 1.2s}
#splash #floor.on{opacity:1}
#splash #flare{position:absolute;width:150px;height:24px;border-radius:50%;background:radial-gradient(ellipse at center,#fff 0%,#ffd2b3 16%,rgba(255,42,68,.8) 42%,rgba(211,1,29,0) 72%);transform:rotate(-38deg) scale(0);opacity:0;filter:drop-shadow(0 0 16px #ff2a44)}
#splash #flare.on{opacity:1;transform:rotate(-38deg) scale(1);transition:transform .8s cubic-bezier(.2,1.2,.3,1),opacity .4s}
#splash #flare.off{opacity:0;transform:rotate(-38deg) scale(2.4);transition:transform .9s ease-in,opacity .7s}
#splash #sh2{position:relative;width:80%;opacity:0;transform:scale(.55);filter:drop-shadow(0 0 0 rgba(255,42,68,0))}
#splash #sh2.on{opacity:1;transform:scale(1);filter:drop-shadow(0 0 14px rgba(255,42,68,.7));transition:all 1s cubic-bezier(.2,1.1,.3,1)}
#splash .nom{width:min(72vw,300px);display:flex;flex-direction:column;gap:12px}
#splash .nom img{width:100%;opacity:0;transform:translateY(16px);filter:blur(6px);transition:all .9s ease-out}
#splash .nom img+img{transition-delay:.25s}
#splash .nom.on img{opacity:1;transform:none;filter:none}
#splash small{position:absolute;bottom:22px;color:#6b6252;font:12px Arial;letter-spacing:1px}
</style>
<div id="splash" aria-hidden="true">
  <canvas id="warp"></canvas><div id="flash"></div>
  <div class="stage">
    <div id="tile"><div id="beam"></div><div id="flare"></div><img id="sh2" src="img/tiburon.png" alt=""><div id="floor"></div></div>
    <div class="nom" id="nom"><img src="img/texto.png" alt=""><img src="img/barra.png" alt=""></div>
  </div>
  <small>Toca para saltar</small>
</div>
<script>
(async()=>{
  const sp=document.getElementById("splash");
  if(sessionStorage.getItem("sd_splash")||matchMedia("(prefers-reduced-motion: reduce)").matches){sp.remove();return;}
  sessionStorage.setItem("sd_splash","1");
  let vivo=true; const fin=()=>{vivo=false;sp.classList.add("fuera");setTimeout(()=>sp.remove(),900);};
  sp.addEventListener("click",fin); setTimeout(fin,10000);
  const $=i=>document.getElementById(i), wait=ms=>new Promise(r=>setTimeout(r,ms)), on=(i,c="on")=>$(i).classList.add(c);
  try{
    await Promise.all([...sp.querySelectorAll("img")].map(i=>i.decode().catch(()=>{})));
    /* 1) túnel de luz: rayos rojos y crema que salen del centro */
    const cv=$("warp"),cx=cv.getContext("2d"),d=Math.min(devicePixelRatio||1,2);
    const W=cv.width=innerWidth*d,H=cv.height=innerHeight*d,ox=W/2,oy=H*.46,R=Math.hypot(W,H)/2;
    const cols=["240,223,196","255,42,68","211,1,29","255,120,90"];
    const S=Array.from({length:190},()=>({a:Math.random()*6.283,v:.3+Math.random()*1.1,l:.2+Math.random()*.7,c:cols[Math.random()*4|0],w:.6+Math.random()*2.4}));
    const t0=performance.now();
    $("flash").animate([{opacity:0},{opacity:.95,offset:.55},{opacity:0}],{duration:1500,delay:900,fill:"both"});
    (function loop(now){
      const t=(now-t0)/1000; if(!vivo||t>2){cx.clearRect(0,0,W,H);return;}
      cx.globalCompositeOperation="source-over"; cx.fillStyle="rgba(0,0,0,.32)"; cx.fillRect(0,0,W,H);
      cx.globalCompositeOperation="lighter";
      const k=Math.pow(t/1.7,2.3)*R*1.7, al=Math.min(1,t/.35)*(t>1.5?Math.max(0,(2-t)/.5):1);
      for(const s of S){
        const r=k*s.v, r0=Math.max(0,r-(k*s.l*.55)-4); if(r<6)continue;
        cx.strokeStyle=`rgba(${s.c},${al})`; cx.lineWidth=s.w*d*(.4+t);
        cx.beginPath(); cx.moveTo(ox+Math.cos(s.a)*r0,oy+Math.sin(s.a)*r0); cx.lineTo(ox+Math.cos(s.a)*r,oy+Math.sin(s.a)*r); cx.stroke();
      }
      requestAnimationFrame(loop);
    })(t0);
    await wait(1750); if(!vivo)return;
    /* 2) queda un rayo de luz en el centro */
    on("flare"); await wait(750); if(!vivo)return;
    /* 3) aparece la tarjeta de cristal con haz de luz y reflejo */
    on("tile"); on("beam"); on("floor"); await wait(1100); if(!vivo)return;
    /* 4) el rayo se convierte en el tiburón y salen las letras */
    on("flare","off"); on("sh2"); await wait(900); if(!vivo)return;
    on("nom"); await wait(2100); fin();
  }catch(e){fin();}
})();
</script>
<!-- /SPLASH -->
<main class="centro">
  <img class="logo" src="icon-192.png" alt="">
  <h1>SHARK DARK</h1><p class="sub" style="text-align:center">CBTIS 170 · Portal escolar</p>
  <div class="card">
    <label for="rol">Entrar como</label>
    <select id="rol"><option value="alumno">Alumno</option><option value="tutor">Tutor</option><option value="docente">Docente</option></select>
    <label for="u" id="lu">CURP</label><input id="u" placeholder="Tu CURP (18 caracteres)" autocomplete="username" autocapitalize="characters" style="text-transform:uppercase">
    <label for="p">Contraseña</label><input id="p" type="password" placeholder="Tu contraseña" autocomplete="current-password">
    <button class="btn" id="entrar">ENTRAR</button><p class="msg" id="msg"></p>
  </div>
  <div class="card"><h2>¿Eres nuevo? Crea tu cuenta</h2><div class="trio">
    <a class="btn sec" style="margin:0" href="registro_alumno.html">Soy alumno</a><a class="btn sec" style="margin:0" href="registro_tutor.html">Soy tutor</a><a class="btn sec" style="margin:0" href="registro_docente.html">Soy docente</a></div></div>
  </main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i), DEST={alumno:"menu_alumnos.html",docente:"menu_docentes.html",tutor:"menu_tutor.html",admin:"admin.html#cuentas"};
const s=SD.session(); if(s&&DEST[s.rol]) location.replace(DEST[s.rol]);
async function entrar(){
  $("msg").textContent="Entrando…";
  try{const u=await SD.login($("rol").value,$("u").value,$("p").value); location.href=DEST[u.rol];}
  catch(e){$("msg").textContent=e.message;}
}
const lab=()=>{const d=$("rol").value==="docente";$("lu").textContent=d?"RFC":"CURP";$("u").placeholder=d?"Tu RFC (13 caracteres)":"Tu CURP (18 caracteres)";localStorage.setItem("sd_rol",$("rol").value);};
$("rol").value=localStorage.getItem("sd_rol")||"alumno"; $("rol").onchange=lab; lab();
$("entrar").onclick=entrar; $("p").addEventListener("keydown",e=>{if(e.key==="Enter")entrar();});
</script></body></html>
