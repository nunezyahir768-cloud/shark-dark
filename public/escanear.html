<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Escanear QR</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050505"><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:24px 16px 70px;font-family:Arial,Helvetica,sans-serif;color:#f9f4eb;background:radial-gradient(circle at 12% 12%,rgba(250,46,73,0.16),transparent 27%),radial-gradient(circle at 88% 80%,rgba(166,3,24,0.22),transparent 30%),linear-gradient(135deg,#11090a,#2d181b 52%,#1c0f11)}
main{width:min(520px,100%);margin:auto}
.brand{font-weight:900;letter-spacing:2px;font-size:20px;margin-bottom:20px}.brand span{color:#fa2e49}
h1{font-size:28px;margin-bottom:6px}.sub{color:#d9ccb8;font-size:14px;line-height:1.5;margin-bottom:20px}
.card{padding:20px;border:1px solid rgba(249,244,235,0.12);border-radius:17px;background:rgba(30,16,18,0.92);margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:11px;color:#f9f4eb;background:linear-gradient(90deg,#a60318,#e50624);font-size:14px;font-weight:bold;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
input{width:100%;padding:14px 16px;border:1px solid rgba(249,244,235,0.12);border-radius:10px;color:#f9f4eb;background:#321619;font-size:15px;letter-spacing:1px;text-transform:uppercase;outline:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}dt{color:#c8b699}dd{word-break:break-word}
.back{display:inline-block;margin-top:8px;color:#efe0c8;text-decoration:none;font-size:13px}
.msg{color:#ffb454;font-size:13px;margin-top:10px;min-height:18px}.ok{color:#7dffb0}
ul{list-style:none;font-size:14px}li{padding:8px 0;border-bottom:1px solid rgba(249,244,235,0.08);display:flex;justify-content:space-between;gap:8px}
video{width:100%;border-radius:12px;background:#000000;margin-top:12px;display:none}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid #ffb454;color:#ffb454}
.banner{display:none;padding:20px;border-radius:16px;text-align:center;font-weight:bold;margin-bottom:14px}
.banner b{display:block;font-size:26px;margin-bottom:4px}.banner.ok{background:#0f5132;border:2px solid #7dffb0}.banner.warn{background:#5c4300;border:2px solid #ffb454}.banner.err{background:#58151c;border:2px solid #ff6b78}
select{width:100%;padding:12px;margin-top:8px;border-radius:10px;color:#f9f4eb;background:#321619;border:1px solid rgba(249,244,235,0.12);font-size:14px}
.mini{margin-left:8px;padding:3px 9px;border-radius:8px;border:1px solid rgba(240,223,196,.4);background:transparent;color:#f0dfc4;font-size:12px;cursor:pointer}
</style></head><body><main>
<div class="brand">🦈 <span>SHARK</span> DARK</div>

<h1 id="tit">Escanear QR</h1>
<p class="sub" id="sub">Al escanear, la asistencia se registra sola y verás si asistió.</p>
<div class="banner" id="banner"></div>
<div class="card" id="clase" style="display:none">
  <h2 style="font-size:13px;color:#fa2e49;letter-spacing:1px;margin-bottom:8px">CLASE DE AHORA</h2>
  <input id="mat" list="mats" placeholder="Materia (ej. Matemáticas)" maxlength="60" style="text-transform:none"><datalist id="mats"></datalist>
  <select id="ar"><option>Programación</option><option>Ofimática</option><option>Enfermería</option><option>Electricidad</option><option>Laboratorios Químicos</option><option>Administración</option></select>
  <select id="se"><option>1-2 semestre</option><option>3-4 semestre</option><option>5-6 semestre</option></select>
  <select id="gr"><option>A</option><option>B</option></select>
</div>
<div class="card" id="buscar">
  <button class="btn" id="cam">📷 ACTIVAR CÁMARA</button>
  <video id="video" playsinline muted></video>
  <div style="display:flex;gap:8px;margin-top:12px"><input id="curp" maxlength="18" placeholder="o escribe la CURP"><button class="btn" id="ir" style="width:auto;margin:0;padding:0 18px">OK</button></div>
</div>
<div class="card" id="ficha" style="display:none"><dl id="datos"></dl></div>
<div class="card" id="hist" style="display:none"><h2 style="font-size:16px;margin-bottom:8px">Historial</h2><ul id="lista"></ul></div>
<div class="card" id="cierre" style="display:none"><p class="sub" style="margin:0 0 4px">Cuando termine la clase, marca falta a quien no escaneó y avisa a su tutor.</p><button class="btn" id="cerrar">CERRAR LISTA DE ESTA CLASE</button></div>
<div class="card" id="grupo" style="display:none"><h2 style="font-size:16px;margin-bottom:8px">Lista del grupo <span id="cont"></span></h2><ul id="lg"></ul><button class="btn" id="rep" style="margin-top:12px;background:transparent;border:1px solid rgba(240,223,196,.4)">📥 Descargar reporte del mes (Excel)</button></div>
<a class="back" id="volver" href="#">← Volver al menú</a>
</main>
<script src="app.js"></script>
<script src="lib/jsQR.js" onerror="this.remove()"></script>
<script>
const $=i=>document.getElementById(i), esc=SD.esc, s=SD.require(["docente","tutor"]), doc=s.rol==="docente";
$("volver").href=doc?"menu_docentes.html":"menu_tutor.html";
let parar=null, ultimo="";
function aviso(cls,titulo,txt){try{lista()}catch(e){}const b=$("banner");b.className="banner "+cls;b.style.display="block";b.innerHTML="<b>"+esc(titulo)+"</b>"+esc(txt||"");if(navigator.vibrate)navigator.vibrate(cls==="ok"?120:[80,60,80]);}

async function ficha(curp){
  const r=await SD.consultar(curp);
  if(!r.alumno){$("ficha").style.display=$("hist").style.display="none";return r;}
  $("datos").innerHTML=[["Nombre",r.alumno.nombre],["CURP",r.alumno.curp],["Área",r.alumno.area],["Semestre",r.alumno.semestre],["Grupo",r.alumno.grupo]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v||"—")}</dd>`).join("");
  $("ficha").style.display=$("hist").style.display="block";
  $("lista").innerHTML=r.asistencias.slice(0,30).map(a=>`<li><span>${esc(a.fecha)} · ${esc(a.hora)}</span><span>${a.estado==="falta"?'<span class="tag" style="color:#ff6b78;border-color:#ff6b78">falta · '+esc(a.materia||"")+'</span>':a.estado==="justificada"?'<span class="tag" style="color:#f0dfc4;border-color:#f0dfc4">justificada</span>':a.pendiente?'<span class="tag">pendiente</span>':esc(a.materia||a.docenteNombre||"")}</span></li>`).join("")||"<li>Sin registros</li>";
  return r;
}
const guardada=JSON.parse(localStorage.getItem("sd_clase")||"{}");
for(const k of ["mat","ar","se","gr"]) if(guardada[k]) $(k).value=guardada[k];
$("mats").innerHTML=(JSON.parse(localStorage.getItem("sd_mats")||"[]")).map(m=>`<option value="${esc(m)}">`).join("");
function clase(){const c={materia:$("mat").value.trim().replace(/\s+/g," "),area:$("ar").value,semestre:$("se").value,grupo:$("gr").value};
  localStorage.setItem("sd_clase",JSON.stringify({mat:c.materia,ar:c.area,se:c.semestre,gr:c.grupo}));return c;}
function recordar(m){const l=JSON.parse(localStorage.getItem("sd_mats")||"[]").filter(x=>x.toLowerCase()!==m.toLowerCase());l.unshift(m);localStorage.setItem("sd_mats",JSON.stringify(l.slice(0,15)));}
async function lista(){
  if(!doc)return; const c=clase(), d=await SD.datos(), k=c.materia.toLowerCase(), hoy=new Date().toLocaleDateString("sv-SE");
  const g=d.alumnos.filter(a=>a.area===c.area&&a.semestre===c.semestre&&a.grupo===c.grupo).sort((x,y)=>x.nombre.localeCompare(y.nombre));
  const reg=a=>d.asistencias.find(r=>r.curp===a.curp&&r.fecha===hoy&&(r.materia||"").toLowerCase()===k);
  if(!c.materia){$("cont").textContent="";$("lg").innerHTML='<li>Escribe la materia para ver quién ya llegó.</li>';return;}
  $("cont").textContent="· llegaron "+g.filter(a=>(reg(a)||{}).estado==="asistio").length+" de "+g.length;
  $("lg").innerHTML=g.map(a=>{const r=reg(a),u=r?esc(r.uid):"";
    const st=!r?"○ falta por llegar":r.estado==="asistio"?"✔ llegó":r.estado==="justificada"?"◐ justificada":"✖ falta";
    const bt=!r||r.pendiente?"":r.estado==="falta"?`<button class="mini" data-u="${u}" data-a="justificar">Justificar</button>`:r.estado==="asistio"?`<button class="mini" data-u="${u}" data-a="quitar">Quitar</button>`:"";
    return `<li><span>${esc(a.nombre)}</span><span>${st}${bt}</span></li>`;}).join("")||"<li>No hay alumnos registrados en este grupo.</li>";
}
$("lg").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-u]");if(!b)return;let motivo="";
  if(b.dataset.a==="justificar"){motivo=prompt("Motivo de la justificación (opcional):");if(motivo===null)return;}
  else if(!confirm("¿Quitar este registro de asistencia?"))return;
  try{await SD.corregir(b.dataset.u,b.dataset.a,motivo||"");aviso("ok","✔ Listo",b.dataset.a==="quitar"?"Registro quitado.":"Falta justificada; se avisó al tutor.");}
  catch(err){aviso("err","No se pudo",err.message);}});
for(const i of ["mat","ar","se","gr"])$(i).addEventListener("input",lista);
$("rep").onclick=async()=>{
  const c=clase(), d=await SD.datos(), mes=new Date().toLocaleDateString("sv-SE").slice(0,7);
  const g=new Map(d.alumnos.filter(a=>a.area===c.area&&a.semestre===c.semestre&&a.grupo===c.grupo).map(a=>[a.curp,a]));
  const est={asistio:"Asistió",falta:"Falta",justificada:"Justificada"};
  const rows=d.asistencias.filter(r=>g.has(r.curp)&&r.fecha.startsWith(mes)&&(!c.materia||(r.materia||"").toLowerCase()===c.materia.toLowerCase()))
    .sort((x,y)=>g.get(x.curp).nombre.localeCompare(g.get(y.curp).nombre)||x.fecha.localeCompare(y.fecha))
    .map(r=>[g.get(r.curp).nombre,r.curp,r.fecha,r.hora,r.materia||"",est[r.estado]||r.estado,r.motivo||""]);
  const csv=[["Alumno","CURP","Fecha","Hora","Materia","Estado","Motivo"],...rows].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})); a.download="asistencias-"+c.area+"-"+c.semestre+"-"+c.grupo+"-"+mes+".csv"; a.click();
  aviso("ok","📥 Reporte listo",rows.length+" registros. Ábrelo con Excel.");
};
document.addEventListener("sd-sync",()=>lista());
async function procesar(curp){
  curp=curp.trim().toUpperCase(); $("curp").value=curp;
  if(!/^[A-Z0-9]{18}$/.test(curp)) return aviso("err","✖ QR no válido","No contiene una CURP.");
  const r=await ficha(curp);
  if(!r.alumno) return aviso("err","✖ No encontrado",r.offline?"Sin conexión y ese alumno no está en este dispositivo.":"Esa CURP no está registrada.");
  if(!doc) return;
  const c=clase(); if(!c.materia) return aviso("err","Falta la materia","Escribe la materia de esta clase arriba.");
  if(r.alumno.area!==c.area||r.alumno.semestre!==c.semestre||r.alumno.grupo!==c.grupo) return aviso("warn","No es de este grupo",r.alumno.nombre+" es de "+r.alumno.area+" · "+r.alumno.semestre+" · Grupo "+r.alumno.grupo);
  recordar(c.materia);
  const x=await SD.asistencia(curp,c); await ficha(curp);
  if(x.duplicada) aviso("warn","Ya registrado",r.alumno.nombre+" ya tenía asistencia en "+c.materia+" ("+x.asistencia.hora+")");
  else aviso("ok","✔ ASISTIÓ",r.alumno.nombre+" · "+c.materia+" · "+x.asistencia.hora+(navigator.onLine?"":" (se enviará al tutor al volver internet)"));
}
$("ir").onclick=()=>procesar($("curp").value);
$("curp").addEventListener("keydown",e=>{if(e.key==="Enter")procesar($("curp").value)});
$("cam").onclick=async()=>{
  if(parar){parar();parar=null;$("video").style.display="none";$("cam").textContent="📷 ACTIVAR CÁMARA";return;}
  try{
    $("video").style.display="block"; $("cam").textContent="DETENER CÁMARA";
    parar=await SD.scan($("video"),t=>{t=t.trim().toUpperCase(); if(t!==ultimo){ultimo=t;procesar(t);setTimeout(()=>ultimo="",4000);}},m=>aviso("err","Sin lector",m));
  }catch(e){ $("video").style.display="none"; $("cam").textContent="📷 ACTIVAR CÁMARA"; aviso("err","Cámara","No se pudo abrir (permiso o HTTPS)."); }
};
$("cerrar").onclick=async()=>{
  const c=clase(); if(!c.materia) return aviso("err","Falta la materia","Escribe la materia de esta clase arriba.");
  if(!confirm("¿Cerrar lista de "+c.materia+"?\n"+c.area+" · "+c.semestre+" · Grupo "+c.grupo+"\nQuien no haya asistido quedará con falta."))return;
  recordar(c.materia);
  const f=await SD.cierre(c);
  f.length?aviso("warn","Faltaron "+f.length+" a "+c.materia,f.join(", ")):aviso("ok","✔ Todos asistieron","Sin faltas en "+c.materia+".");
};
if(doc){ $("cierre").style.display=$("clase").style.display=$("grupo").style.display="block"; lista(); }
else{ $("tit").textContent="Ficha del alumno"; $("sub").textContent="Datos y asistencias de tu alumno."; $("buscar").style.display="none"; ficha(s.curpAlumno||""); document.addEventListener("sd-sync",()=>ficha(s.curpAlumno||"")); }
</script></body></html>
