<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Calificaciones</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A0A0E"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body><main>
<h1>Calificaciones</h1>
<div class="banner" id="banner"></div>
<div class="card" id="doc" style="display:none">
  <select id="cl"></select>
  <select id="pa"><option value="1">Parcial 1</option><option value="2">Parcial 2</option><option value="3">Parcial 3</option></select>
  <button class="btn" id="cargar">CARGAR ALUMNOS</button>
  <div style="overflow-x:auto;margin-top:12px"><table class="tb" id="tabla"></table></div>
  <button class="btn" id="guardar" style="display:none">GUARDAR MIS CALIFICACIONES</button>
  <button class="btn" id="xl" style="display:none;background:transparent;border:1px solid rgba(122,31,38,.45)">📥 Descargar en Excel</button>
</div>
<div id="ver"></div>
<a class="back" id="volver" href="#">← Volver al menú</a>
</main>
<script src="app.js"></script>
<script src="shell.js"></script>
<script src="excel.js"></script>
<script>
const $=i=>document.getElementById(i), esc=SD.esc;
const s=SD.require(["alumno","docente","tutor"]), doc=s.rol==="docente";
$("volver").href={alumno:"menu_alumnos.html",docente:"menu_docentes.html",tutor:"menu_tutor.html"}[s.rol];
function aviso(cls,t,x){const b=$("banner");b.className="banner "+cls;b.style.display="block";b.innerHTML="<b>"+esc(t)+"</b>"+esc(x||"");}
let notas=[];
async function traer(){try{notas=await SD.api("/api/calificaciones");localStorage.setItem("sd_calif",JSON.stringify(notas));}catch(e){notas=JSON.parse(localStorage.getItem("sd_calif")||"[]");}}
function ver(){
  const m={};for(const n of notas)(m[n.materia]=m[n.materia]||{})[n.parcial]=n.nota;
  $("ver").innerHTML=Object.keys(m).sort().map(k=>{const v=m[k],xs=[1,2,3].filter(p=>v[p]!==undefined).map(p=>v[p]);
    return `<div class="card"><h2 style="font-size:16px">${esc(k)}</h2><ul>${[1,2,3].map(p=>`<li><span>Parcial ${p}</span><span>${v[p]!==undefined?v[p]:"—"}</span></li>`).join("")}
    <li><b>Promedio</b><b>${xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1):"—"}</b></li></ul></div>`;}).join("")||'<div class="card"><p class="sub" style="margin:0">Aún no hay calificaciones.</p></div>';
}
if(doc){
  $("doc").style.display="block"; let clases=[];
  (async()=>{try{clases=await SD.api("/api/clases");localStorage.setItem("sd_clases",JSON.stringify(clases));}catch(e){clases=JSON.parse(localStorage.getItem("sd_clases")||"[]");}
    $("cl").innerHTML=clases.map(c=>`<option value="${esc(c.id)}">${esc(c.materia+" · "+c.semestre+" "+c.area+" "+c.grupo)}</option>`).join("")||"<option value=''>No tienes clases asignadas</option>";})();
  let mats=[], al=[], cur=null;
  const promedios=()=>document.querySelectorAll("#tabla tr[data-c]").forEach(tr=>{
    const v=[...tr.querySelectorAll("td")].slice(2,-1).map(td=>{const i=td.querySelector("input"),t=i?i.value:td.textContent;return t===""||t==="–"?NaN:+t;}).filter(n=>!isNaN(n));
    tr.querySelector(".pr").textContent=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):"–";});
  $("tabla").addEventListener("input",promedios);
  $("cargar").onclick=async()=>{
    const c=clases.find(x=>x.id===$("cl").value); if(!c) return aviso("err","Elige una clase",""); cur=c;
    await traer(); const d=await SD.datos(), p=+$("pa").value; let gr=[];
    try{gr=await SD.api("/api/clases?area="+encodeURIComponent(c.area)+"&semestre="+encodeURIComponent(c.semestre)+"&grupo="+encodeURIComponent(c.grupo));}catch(e){gr=[c];}
    mats=[...new Map(gr.map(x=>[x.materia.toLowerCase(),x.materia])).values()].sort((a,b)=>a.localeCompare(b));
    al=d.alumnos.filter(a=>a.area===c.area&&a.semestre===c.semestre&&a.grupo===c.grupo).sort((x,y)=>x.nombre.localeCompare(y.nombre));
    const mia=m=>m.toLowerCase()===c.materia.toLowerCase(), nota=(a,m)=>{const n=notas.find(x=>x.curp===a.curp&&x.materia.toLowerCase()===m.toLowerCase()&&x.parcial===p);return n?n.nota:"";};
    $("tabla").innerHTML="<tr><th>No.</th><th>Nombre</th>"+mats.map(m=>`<th>${esc(m)}${mia(m)?" ✎":""}</th>`).join("")+"<th>Promedio</th></tr>"+
      al.map((a,i)=>`<tr data-c="${esc(a.curp)}"><td>${i+1}</td><td>${esc(a.nombre)}</td>`+mats.map(m=>mia(m)?`<td><input type="number" min="0" max="10" step="0.1" data-c="${esc(a.curp)}" value="${nota(a,m)}"></td>`:`<td>${nota(a,m)===""?"–":nota(a,m)}</td>`).join("")+'<td class="pr"></td></tr>').join("");
    promedios(); $("guardar").style.display=$("xl").style.display=al.length?"block":"none";
    aviso("ok","Tu columna es "+c.materia,"Las demás asignaturas las captura cada profesor.");
  };
  $("guardar").onclick=async()=>{
    const lista=[...document.querySelectorAll("#tabla input")].filter(i=>i.value!=="").map(i=>({curp:i.dataset.c,nota:+i.value}));
    try{const r=await SD.api("/api/calificaciones",{method:"POST",body:{materia:cur.materia,parcial:+$("pa").value,notas:lista}});aviso("ok","✔ Guardadas",r.guardadas+" calificaciones. Los tutores recibieron el aviso.");}
    catch(e){aviso("err","No se pudo guardar",e.status?e.message:"Necesitas internet para guardar calificaciones");}
  };
  $("xl").onclick=()=>{
    const filas=[...document.querySelectorAll("#tabla tr[data-c]")].map(tr=>{const td=[...tr.querySelectorAll("td")];
      return [td[1].textContent,td.slice(2,-1).map(c=>{const i=c.querySelector("input"),t=i?i.value:c.textContent;return t===""||t==="–"?"":+t;})];});
    const blob=SDExcel.calificaciones({titulo:"CBTIS 170 · SHARK DARK",subtitulo:"Calificaciones · "+cur.semestre+" "+cur.area+" "+cur.grupo+" · Parcial "+$("pa").value,materias:mats,filas});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=("calificaciones-"+cur.semestre+cur.area+cur.grupo+"-P"+$("pa").value+".xlsx").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w.-]+/g,"_"); a.click();
  };
}else{ (async()=>{ await traer(); if(s.rol==="tutor"){const a=await SD.alumnoActivo(); notas=notas.filter(n=>a&&n.curp===a.curp);} ver(); })(); }
</script></body></html>
