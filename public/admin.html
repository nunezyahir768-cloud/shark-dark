<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Administración</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#050505"><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:24px 16px 70px;font-family:Arial,Helvetica,sans-serif;color:#f9f4eb;background:radial-gradient(circle at 12% 12%,rgba(250,46,73,0.16),transparent 27%),radial-gradient(circle at 88% 80%,rgba(166,3,24,0.22),transparent 30%),linear-gradient(135deg,#11090a,#2d181b 52%,#1c0f11)}
main{width:min(520px,100%);margin:auto}
.brand{font-weight:900;letter-spacing:2px;font-size:20px;margin-bottom:20px}.brand span{color:#fa2e49}
h1{font-size:28px;margin-bottom:6px}.sub{color:#d9ccb8;font-size:14px;line-height:1.5;margin-bottom:20px}
.card{padding:20px;border:1px solid rgba(249,244,235,0.12);border-radius:17px;background:rgba(30,16,18,0.92);margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:11px;color:#f9f4eb;background:linear-gradient(90deg,#a60318,#e50624);font-size:14px;font-weight:bold;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
input{width:100%;padding:14px 16px;border:1px solid rgba(249,244,235,0.12);border-radius:10px;color:#f9f4eb;background:#321619;font-size:15px;letter-spacing:1px;text-transform:uppercase;outline:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}dt{color:#c8b699}dd{word-break:break-word}
.back{display:inline-block;margin-top:8px;color:#efe0c8;text-decoration:none;font-size:13px}
.msg{color:#ffb454;font-size:13px;margin-top:10px;min-height:18px}.ok{color:#7dffb0}
ul{list-style:none;font-size:14px}li{padding:8px 0;border-bottom:1px solid rgba(249,244,235,0.08);display:flex;justify-content:space-between;gap:8px}
video{width:100%;border-radius:12px;background:#000000;margin-top:12px;display:none}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid #ffb454;color:#ffb454}
.banner{display:none;padding:20px;border-radius:16px;text-align:center;font-weight:bold;margin-bottom:14px}
.banner b{display:block;font-size:26px;margin-bottom:4px}.banner.ok{background:#0f5132;border:2px solid #7dffb0}.banner.warn{background:#5c4300;border:2px solid #ffb454}.banner.err{background:#58151c;border:2px solid #ff6b78}
select{width:100%;padding:12px;margin-top:8px;border-radius:10px;color:#f9f4eb;background:#321619;border:1px solid rgba(249,244,235,0.12);font-size:14px}
.mini{margin-left:8px;padding:3px 9px;border-radius:8px;border:1px solid rgba(240,223,196,.4);background:transparent;color:#f0dfc4;font-size:12px;cursor:pointer}
</style></head><body><main>
<div class="brand">🦈 <span>SHARK</span> DARK</div>

<h1>Administración</h1>
<div class="banner" id="banner"></div>
<div class="card" id="acceso">
  <p class="sub" style="margin:0 0 8px" id="subacc">Entra con tu usuario de administrador.</p>
  <input id="u" placeholder="Usuario" autocomplete="off" style="text-transform:none">
  <input id="p" type="password" placeholder="Contraseña" style="margin-top:8px;text-transform:none">
  <input id="c" placeholder="Código de administración" autocomplete="off" style="margin-top:8px;display:none;text-transform:none">
  <button class="btn" id="entrar">ENTRAR</button>
  <button class="btn" id="alt" style="background:transparent;border:1px solid rgba(240,223,196,.4)">Crear cuenta de administrador</button>
</div>
<div id="panel" style="display:none">
  <div style="display:flex;gap:8px;margin-bottom:12px"><button class="mini t" data-t="cuentas" style="margin:0">Cuentas</button><button class="mini t" data-t="grupos" style="margin:0">Grupos</button><button class="mini t" data-t="clases" style="margin:0">Clases</button></div>
  <div id="v-cuentas"><input id="q" placeholder="Buscar por nombre o CURP" style="text-transform:none;margin-bottom:12px"><div id="lista"></div></div>
  <div id="v-grupos" style="display:none">
    <div class="card"><h2 style="font-size:16px">Nuevo grupo</h2>
      <select id="gs"><option>1-2 semestre</option><option>3-4 semestre</option><option>5-6 semestre</option></select><select id="ga"><option>Programación</option><option>Ofimática</option><option>Enfermería</option><option>Electricidad</option><option>Laboratorios Químicos</option><option>Administración</option></select><select id="gl"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>
      <button class="btn" id="addg">AÑADIR GRUPO</button></div>
    <div id="lg"></div></div>
  <div id="v-clases" style="display:none">
    <div class="card"><h2 style="font-size:16px">Nueva clase (materia de un grupo)</h2>
      <select id="cg"></select><input id="cm" placeholder="Materia (ej. Matemáticas)" maxlength="60" style="margin-top:8px;text-transform:none"><select id="cd"></select>
      <button class="btn" id="addc">AÑADIR CLASE</button></div>
    <div class="card" id="qrc" style="display:none;text-align:center"></div>
    <div id="lc"></div></div>
</div>
<a class="back" href="entrada.html">← Volver</a>
</main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i), esc=SD.esc;
let modo="entrar", todos=[], grupos=[], clases=[];
function aviso(cls,t,x){const b=$("banner");b.className="banner "+cls;b.style.display="block";b.innerHTML="<b>"+esc(t)+"</b>"+esc(x||"");}
const s=SD.session();
const api=(p,b)=>SD.api(p,b?{method:"POST",body:b}:{});
async function recargar(){
  try{[todos,grupos,clases]=await Promise.all([api("/api/admin/usuarios"),fetch("/api/grupos").then(r=>r.json()),api("/api/clases")]);}catch(e){aviso("err","No se pudo cargar",e.message);}
  grupos.sort((a,b)=>a.nombre.localeCompare(b.nombre)); pintar(); pintarG(); pintarC();
}
function ver(t){for(const k of ["cuentas","grupos","clases"])$("v-"+k).style.display=k===t?"block":"none";}
document.querySelectorAll(".t").forEach(b=>b.onclick=()=>ver(b.dataset.t));
async function panel(){$("acceso").style.display="none";$("panel").style.display="block";await recargar();}
function pintar(){
  const q=$("q").value.trim().toLowerCase();
  const l=todos.filter(u=>!q||(u.nombre+" "+(u.curp||u.rfc||"")).toLowerCase().includes(q)).sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,80);
  $("lista").innerHTML=l.map(u=>`<div class="card"><b>${esc(u.nombre)}</b> <span class="tag">${esc(u.rol)}</span>
    <p class="sub" style="margin:4px 0 8px">${esc(u.curp||u.rfc||"")}${u.rol==="alumno"?" · "+esc(u.semestre)+" "+esc(u.area)+" "+esc(u.grupo):""}${u.curpAlumno?" · alumno "+esc(u.curpAlumno):""}</p>
    <button class="mini" data-a="reset" data-r="${u.rol}" data-i="${esc(u.id)}">Restablecer contraseña</button>
    ${u.rol==="alumno"?`<button class="mini" data-a="editar" data-i="${esc(u.id)}">Cambiar grupo</button>`:""}
    <button class="mini" style="color:#ff6b78" data-a="borrar" data-r="${u.rol}" data-i="${esc(u.id)}">Borrar</button></div>`).join("")||'<p class="sub">Sin resultados.</p>';
}
function pintarG(){
  $("lg").innerHTML=grupos.map(g=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span><b>${esc(g.nombre)}</b><br><small style="color:#8a7d68">${todos.filter(u=>u.rol==="alumno"&&u.area===g.area&&u.semestre===g.semestre&&u.grupo===g.grupo).length} alumnos · ${clases.filter(c=>c.area===g.area&&c.semestre===g.semestre&&c.grupo===g.grupo).length} materias</small></span><button class="mini" style="color:#ff6b78" data-g="${esc(g.id)}">Borrar</button></div>`).join("")||'<p class="sub">Aún no hay grupos.</p>';
  $("cg").innerHTML=grupos.map((g,i)=>`<option value="${i}">${esc(g.nombre)}</option>`).join("");
  $("cd").innerHTML=todos.filter(u=>u.rol==="docente").map(u=>`<option value="${esc(u.id)}">${esc(u.nombre)}</option>`).join("")||"<option value=''>No hay docentes registrados</option>";
}
function pintarC(){
  $("lc").innerHTML=clases.sort((a,b)=>(a.semestre+a.area+a.grupo+a.materia).localeCompare(b.semestre+b.area+b.grupo+b.materia)).map(c=>`<div class="card"><b>${esc(c.materia)}</b><p class="sub" style="margin:2px 0 8px">${esc(c.semestre)} ${esc(c.area)} ${esc(c.grupo)} · Prof. ${esc(c.docenteNombre||c.docente)}</p><button class="mini" data-q="${esc(c.id)}">Ver QR</button><button class="mini" style="color:#ff6b78" data-c="${esc(c.id)}">Borrar</button></div>`).join("")||'<p class="sub">Aún no hay clases.</p>';
}
$("q").addEventListener("input",pintar);
$("addg").onclick=async()=>{try{await api("/api/admin/grupos",{semestre:$("gs").value,area:$("ga").value,grupo:$("gl").value});aviso("ok","✔ Grupo añadido","");await recargar();}catch(e){aviso("err","No se pudo",e.message);}};
$("addc").onclick=async()=>{const g=grupos[+$("cg").value];if(!g)return aviso("err","Primero crea un grupo","");
  try{const r=await api("/api/admin/clases",{area:g.area,semestre:g.semestre,grupo:g.grupo,materia:$("cm").value,docente:$("cd").value});$("cm").value="";aviso("ok","✔ Clase añadida","Se generó su QR: búscala abajo y toca Ver QR.");await recargar();}catch(e){aviso("err","No se pudo",e.message);}};
$("lg").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-g]");if(!b||!confirm("¿Borrar este grupo y sus materias?"))return;
  try{await api("/api/admin/grupos/borrar",{id:b.dataset.g});await recargar();}catch(e){aviso("err","No se pudo",e.message);}});
$("lc").addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.q){const c=clases.find(x=>x.id===b.dataset.q);$("qrc").style.display="block";
    $("qrc").innerHTML='<div style="width:220px;margin:auto;border-radius:10px;overflow:hidden;background:#fff">'+SD.qr("CLASE:"+c.id)+'</div><p style="margin-top:10px"><b>'+esc(c.materia)+'</b><br>'+esc(c.semestre+" "+c.area+" "+c.grupo)+'</p><p class="sub">Imprímelo: el docente lo escanea y se abre esta clase.</p>';scrollTo(0,0);}
  else if(b.dataset.c){if(!confirm("¿Borrar esta clase?"))return;try{await api("/api/admin/clases/borrar",{id:b.dataset.c});await recargar();}catch(e){aviso("err","No se pudo",e.message);}}});
$("lista").addEventListener("click",async ev=>{const b=ev.target.closest("button[data-a]");if(!b)return;const {a,r,i}=b.dataset;
  try{
    if(a==="reset"){if(!confirm("¿Restablecer la contraseña de este usuario?"))return;const x=await api("/api/admin/reset",{rol:r,id:i});aviso("ok","Contraseña temporal",x.temporal+"  (dísela al usuario; que la cambie en Mi cuenta)");}
    else if(a==="borrar"){if(!confirm("¿Borrar esta cuenta? No se puede deshacer."))return;await api("/api/admin/borrar",{rol:r,id:i});await recargar();aviso("ok","Cuenta borrada","");}
    else if(a==="editar"){if(!grupos.length)return aviso("err","Primero crea grupos","Ve a la pestaña Grupos.");
      const n=prompt("Elige el número del grupo nuevo:\n"+grupos.map((g,k)=>(k+1)+") "+g.nombre).join("\n"));const g=grupos[(+n)-1];if(!g)return;
      await api("/api/admin/editar",{id:i,area:g.area,semestre:g.semestre,grupo:g.grupo});await recargar();aviso("ok","Alumno actualizado",g.nombre);}
  }catch(err){aviso("err","No se pudo",err.message);}
});
$("alt").onclick=()=>{modo=modo==="entrar"?"crear":"entrar";$("c").style.display=modo==="crear"?"block":"none";$("entrar").textContent=modo==="crear"?"CREAR CUENTA":"ENTRAR";$("alt").textContent=modo==="crear"?"Ya tengo cuenta":"Crear cuenta de administrador";$("subacc").textContent=modo==="crear"?"Usuario de 4 a 20 letras, números o _. Contraseña de 8 o más.":"Entra con tu usuario de administrador.";};
$("entrar").onclick=async()=>{
  try{const u=$("u").value.trim().toUpperCase();
    if(modo==="crear"){await SD.register("admin",{usuario:u,nombre:u,correo:u.toLowerCase()+"@admin.local",password:$("p").value,codigo:$("c").value});}
    await SD.login("admin",u,$("p").value); panel();
  }catch(err){aviso("err","No se pudo entrar",err.message);}
};
if(s&&s.rol==="admin")panel();
</script></body></html>
