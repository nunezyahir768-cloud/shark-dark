<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Registro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A0A0E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body>
<main class="centro">
  <img class="logo" src="icon-192.png" alt=""><h1>Crear cuenta</h1><p class="sub" style="text-align:center">Tutor: queda ligado a tu alumno</p>
  <div class="card"><form id="f"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" placeholder="Tu nombre completo" required ><label for="curp">Tu CURP</label><input id="curp" name="curp" placeholder="Tu CURP (18 caracteres)" required minlength="18" maxlength="18" pattern="[A-Za-z0-9]{18}" autocapitalize="characters" style="text-transform:uppercase"><label for="curpAlumno">CURP de tu alumno (opcional, puedes agregar más después)</label><input id="curpAlumno" name="curpAlumno" placeholder="CURP del alumno" minlength="18" maxlength="18" pattern="[A-Za-z0-9]{18}" autocapitalize="characters" style="text-transform:uppercase"><label for="correo">Correo electrónico</label><input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required ><label for="password">Contraseña</label><input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
    <button class="btn" type="submit">CREAR CUENTA</button><p class="msg" id="msg"></p></form></div>
  <p class="sub" style="text-align:center"><a href="entrada.html">← Ya tengo cuenta</a></p>
</main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i);

$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("msg").textContent="Guardando…";
  const d=Object.fromEntries(new FormData(e.target)); d.curp=d.curp.toUpperCase();
  d.curpAlumno=(d.curpAlumno||"").toUpperCase();
  try{ await SD.register("tutor",d); await SD.login("tutor",d.curp,d.password); location.href="menu_tutor.html"; }
  catch(err){ $("msg").textContent=err.message; }
});
</script></body></html>
