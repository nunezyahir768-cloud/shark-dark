<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Registro</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4A0A0E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="tema.css">
</head><body>
<main class="centro">
  <img class="logo" src="icon-192.png" alt=""><h1>Crear cuenta</h1><p class="sub" style="text-align:center">Docente: necesitas el código que te da la dirección</p>
  <div class="card"><form id="f"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" placeholder="Tu nombre completo" required ><label for="rfc">RFC</label><input id="rfc" name="rfc" placeholder="Tu RFC (13 caracteres)" required maxlength="13" autocapitalize="characters" style="text-transform:uppercase"><label for="correo">Correo electrónico</label><input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required ><label for="password">Contraseña</label><input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required><label for="codigo">Código de docente</label><input id="codigo" name="codigo" placeholder="Te lo da la dirección" required autocomplete="off">
    <button class="btn" type="submit">CREAR CUENTA</button><p class="msg" id="msg"></p></form></div>
  <p class="sub" style="text-align:center"><a href="entrada.html">← Ya tengo cuenta</a></p>
</main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i);

$("f").addEventListener("submit",async e=>{
  e.preventDefault(); $("msg").textContent="Guardando…";
  const d=Object.fromEntries(new FormData(e.target)); d.rfc=d.rfc.toUpperCase();
  try{ await SD.register("docente",d); await SD.login("docente",d.rfc,d.password); location.href="menu_docentes.html"; }
  catch(err){ $("msg").textContent=err.message; }
});
</script></body></html>
