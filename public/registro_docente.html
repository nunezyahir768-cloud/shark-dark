<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARK DARK | Registro docente</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 15% 20%, #fa2e4940, transparent 25%),
        radial-gradient(circle at 85% 75%, #a6031855, transparent 30%),
        linear-gradient(135deg, #201113, #3a191d 48%, #231315);
}

.contenedor {
    width: min(1050px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    background: #150b0ced;
    border: 1px solid #f9f4eb20;
    border-radius: 28px;
    box-shadow: 0 25px 70px #00000088;
}

.visual {
    min-height: 650px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 45px;
    background:
        radial-gradient(circle at 20% 25%, #e50624aa, transparent 30%),
        radial-gradient(circle at 78% 70%, #a6031888, transparent 30%),
        linear-gradient(145deg, #261417, #311519 55%, #1b0f10);
}

.visual::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .6;
    background-image: radial-gradient(circle, white 1px, transparent 1.5px);
    background-size: 45px 45px;
}

.planeta {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    top: -100px;
    left: -100px;
    background: radial-gradient(circle at 35% 30%,
        #efe0c8, #e50624 45%, #471e24 72%, #261417);
    box-shadow: 0 0 60px #fa2e4955;
}

.visual > *:not(.planeta) {
    position: relative;
    z-index: 2;
}

.marca {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.marca span, .mensaje h2 span {
    color: #fa2e49;
}

.mensaje {
    margin-top: auto;
    margin-bottom: 25px;
}

.mensaje h2 {
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1.1;
    margin-bottom: 15px;
}

.mensaje p {
    color: #eddfc9;
    line-height: 1.7;
}

.formulario {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px;
}

.form-contenido {
    width: 100%;
    max-width: 430px;
}

.encabezado {
    margin-bottom: 25px;
}

.encabezado h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.encabezado p {
    color: #c8b699;
    font-size: 13px;
    line-height: 1.6;
}

label {
    display: block;
    margin: 16px 0 7px;
    font-size: 13px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #f9f4eb20;
    border-radius: 10px;
    outline: none;
    color: white;
    background: #321619;
    font-size: 14px;
    transition: .25s;
}

input::placeholder {
    color: #c5b293;
}

input:focus {
    border-color: #fa2e49;
    box-shadow: 0 0 0 3px #fa2e4920;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 11px;
    color: white;
    background: linear-gradient(90deg, #a60318, #e50624);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover, button:focus-visible {
    outline: none;
    background: linear-gradient(90deg, #a60318, #fa2e49);
    box-shadow: 0 0 0 3px #fa2e4940;
}

.pie {
    margin-top: 20px;
    text-align: center;
    color: #c8b699;
    font-size: 12px;
}

a {
    color: #fa2e49;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

@media (max-width: 800px) {
    body { padding: 12px; }
    .contenedor { grid-template-columns: 1fr; }
    .visual { min-height: 240px; padding: 28px; }
    .planeta { width: 230px; height: 230px; }
    .mensaje h2 { font-size: 34px; }
    .formulario { padding: 32px 24px; }
    .encabezado h1 { font-size: 30px; }
}
.marca span{color:#f0dfc4 !important}
</style>
</head>

<body>
<main class="contenedor">

<section class="visual">
    <div class="planeta"></div>

    <div class="marca">🦈 <span>SHARK</span> DARK</div>

    <div class="mensaje">
        <h2>REGISTRO<br><span>docente.</span></h2>
        <p>Accede a tu espacio de trabajo y gestión académica.</p>
    </div>
</section>

<section class="formulario">
<div class="form-contenido">

    <header class="encabezado">
        <h1>REGISTRO</h1>
        <p>Ingresa tus datos como docente para continuar.</p>
    </header>

    <form id="form">

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre"
               placeholder="Escribe tu nombre completo"
               autocomplete="name" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo"
               placeholder="ejemplo@correo.com"
               autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="Crea una contraseña"
               autocomplete="new-password"
               minlength="8" required>

        <label for="rfc">RFC</label>
        <input type="text" id="rfc" name="rfc"
               placeholder="Ingresa tu RFC"
               minlength="12" maxlength="13"
               pattern="[A-Za-zÑñ&]{3,4}[0-9]{6}[A-Za-z0-9]{3}"
               title="Ingresa un RFC válido de 12 o 13 caracteres"
               autocapitalize="characters" required>

        <button type="submit">REGISTRAR DOCENTE</button>
<p id="msg" style="margin-top:14px;text-align:center;color:#ffb454;font-size:13px;min-height:18px"></p>

    </form>

    <div class="pie">
        <a href="entrada.html">← Volver a la entrada</a>
        <p style="margin-top:12px">SHARK DARK · Portal escolar</p>
    </div>

</div>
</section>

</main>
<script src="app.js"></script>
<script>
const $=i=>document.getElementById(i), msg=$("msg");
$("rfc").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
$("form").addEventListener("submit",async e=>{
  e.preventDefault(); msg.textContent="Guardando…";
  const d=Object.fromEntries(new FormData(e.target)); d.rfc=d.rfc.toUpperCase();
  try{ await SD.register("docente",d); await SD.login("docente",d.rfc,d.password); location.href="menu_docentes.html"; }
  catch(err){ msg.textContent=err.message; }
});
</script>
</body>
</html>
